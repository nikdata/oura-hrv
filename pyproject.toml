[project]
name = "oura-hrv"
version = "0.2.0"
description = "Oura Ring HRV/RHR webhook processor — Azure Functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.21.0",
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-storage-blob>=12.22.0",
    "ipykernel>=7.3.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
